name: Build Muguet IPA

on:
  workflow_dispatch: # 讓妳可以在網頁上手動點擊「開始執行」

jobs:
  build:
    runs-on: macos-14 # 強制指定使用 macOS 14 (Apple Silicon 雲端環境)

    steps:
      - name: 檢查程式碼
        uses: actions/checkout@v4

      - name: 安裝特定版本的 Rust
        run: |
          rustup toolchain install 1.98.1
          rustup default 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1

      - name: 安裝 xcodegen
        run: brew install xcodegen

      - name: 尋找專案設定並編譯
        run: |
          echo "=== 正在尋找 project.yml 的位置 ==="
          PROJECT_YML=$(find . -name "project.yml" | head -n 1)
          echo "找到的檔案路徑: $PROJECT_YML"
          
          # 如果找到了，就用 --spec 指定它生成 Xcode 專案
          if [ -n "$PROJECT_YML" ]; then
            DIR=$(dirname "$PROJECT_YML")
            cd "$DIR"
            xcodegen generate
            echo "=== 開始進行 Xcode 建置與打包 ==="
            # 這裡之後補上編譯指令
          else
            echo "幹！真的找不到 project.yml，結構可能跟想像的不同"
            exit 1
          fi

      - name: 上傳打包好的 IPA 檔案
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-IPA
          path: |
            *.ipa
            # 如果輸出路徑不同，之後再把這邊的路徑改掉
