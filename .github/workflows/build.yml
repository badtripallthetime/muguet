name: Build Muguet IPA

on:
  workflow_dispatch: # 讓妳可以在網頁上手動點擊「開始執行」

jobs:
  build:
    runs-on: macos-14 # 強制指定使用 macOS 14 (Apple Silicon 雲端環境)

    steps:
      - name: 檢查程式碼
        uses: actions/checkout@v4

      - name: 安裝特定版本的 Rust
        run: |
          rustup toolchain install 1.98.1
          rustup default 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1

      - name: 安裝 xcodegen
        run: brew install xcodegen

      - name: 尋找專案設定並編譯
        run: |
          echo "=== 正在尋找 project.yml 的位置 ==="
          PROJECT_YML=$(find . -name "project.yml" | head -n 1)
          echo "找到的檔案路徑: $PROJECT_YML"
          
          # 如果找到了，就用 --spec 指定它生成 Xcode 專案
          if [ -n "$PROJECT_YML" ]; then
            DIR=$(dirname "$PROJECT_YML")
            cd "$DIR"
            xcodegen generate
            echo "=== 開始進行 Xcode 建置與打包 ==="
            # 這裡之後補上編譯指令
          else
            echo "幹！真的找不到 project.yml，結構可能跟想像的不同"
            exit 1
          fi

      - name: 編譯與打包 IPA
        run: |
          PROJECT_YML=$(find . -name "project.yml" | head -n 1)
          DIR=$(dirname "$PROJECT_YML")
          cd "$DIR"
          
          # 1. 生成 Xcode 專案
          xcodegen generate
          
          # 2. 透過 Cargo 進行 iOS 目標的編譯 (如果專案需要)
          # 這裡確保 Rust 依賴正確編譯
          cargo build --target aarch64-apple-ios --release || true
          
          # 3. 使用 xcodebuild 進行編譯與歸檔 (Archive)
          # 假設專案資料夾裡有 .xcodeproj 或者是被 xcodegen 生出來的 workspace/project
          XCODEPROJ=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          SCHEME_NAME=$(basename "$XCODEPROJ" .xcodeproj)
          
          echo "找到的 Xcode 專案: $XCODEPROJ"
          echo "專案 Scheme: $SCHEME_NAME"
          
          # 建立輸出資料夾
          mkdir -p build/Payload
          
          # 進行編譯 (使用 Generic iOS Device 進行 Release 編譯，不需綁定實機憑證即可先打包出未簽名 App)
          xcodebuild -project "$XCODEPROJ" \
                     -scheme "$SCHEME_NAME" \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build/DerivedData \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build
          
          # 將編譯好的 .app 移動到 Payload 準備打包成 .ipa
          # 尋找編譯出來的 .app
          APP_PATH=$(find build/DerivedData -name "*.app" | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" build/Payload/
            cd build
            zip -r Muguet.ipa Payload
            echo "IPA 打包成功！"
          else
            echo "幹！找不到編譯出來的 .app 檔案"
            exit 1
          fi

      - name: 上傳打包好的 IPA 檔案
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-IPA
          path: |
            **/build/Muguet.ipa
