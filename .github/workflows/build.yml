name: Build Muguet IPA

on:
  workflow_dispatch: # 讓妳可以在網頁上手動點擊「開始執行」

jobs:
  build:
    runs-on: macos-14 # 強制指定使用 macOS 14 (Apple Silicon 雲端環境)

    steps:
      - name: 檢查程式碼
        uses: actions/checkout@v4

      - name: 安裝特定版本的 Rust
        run: |
          rustup toolchain install 1.98.1
          rustup default 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1

      - name: 安裝 xcodegen
        run: brew install xcodegen

      - name: 尋找專案設定並編譯
        run: |
          echo "=== 正在尋找 project.yml 的位置 ==="
          PROJECT_YML=$(find . -name "project.yml" | head -n 1)
          echo "找到的檔案路徑: $PROJECT_YML"
          
          # 如果找到了，就用 --spec 指定它生成 Xcode 專案
          if [ -n "$PROJECT_YML" ]; then
            DIR=$(dirname "$PROJECT_YML")
            cd "$DIR"
            xcodegen generate
            echo "=== 開始進行 Xcode 建置與打包 ==="
            # 這裡之後補上編譯指令
          else
            echo "幹！真的找不到 project.yml，結構可能跟想像的不同"
            exit 1
          fi

      - name: 編譯與打包 IPA
        run: |
          PROJECT_YML=$(find . -name "project.yml" | head -n 1)
          DIR=$(dirname "$PROJECT_YML")
          cd "$DIR"
          
          rustup target add aarch64-apple-ios
          export IPHONEOS_DEPLOYMENT_TARGET=15.0
          
          echo "=== 開始透過 Cargo 直接進行 iOS 編譯 ==="
          cargo build --target aarch64-apple-ios --release
          
          echo "=== 檢查編譯結果並組裝 .app ==="
          # 放寬搜尋條件，直接在整個 target 資料夾底下找沒有副檔名的主執行檔
          BINARY_PATH=$(find target -name "muguet" -type f -not -name "*.*" | head -n 1)
          
          if [ -z "$BINARY_PATH" ]; then
            # 如果找不到叫 muguet 的，就找任何符合 arm64 release 的無副檔名檔案
            BINARY_PATH=$(find target/aarch64-apple-ios/release -maxdepth 2 -type f -not -name "*.*" | head -n 1)
          fi
          
          if [ -n "$BINARY_PATH" ]; then
            echo "找到編譯好的二進位檔: $BINARY_PATH"
            
            mkdir -p build/Payload/Muguet.app
            cp "$BINARY_PATH" build/Payload/Muguet.app/Muguet
            
            cat << 'EOF' > build/Payload/Muguet.app/Info.plist
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>CFBundleIdentifier</key>
                <string>com.badtrip.muguet</string>
                <key>CFBundleName</key>
                <string>Muguet</string>
                <key>CFBundlePackageType</key>
                <string>APPL</string>
                <key>CFBundleShortVersionString</key>
                <string>1.0</string>
                <key>CFBundleVersion</key>
                <string>1</string>
                <key>MinimumOSVersion</key>
                <string>15.0</string>
                <key>UIDeviceFamily</key>
                <array>
                    <integer>1</integer>
                    <integer>2</integer>
                </array>
            </dict>
            </plist>
            EOF
            
            cd build
            zip -r Muguet.ipa Payload
            echo "IPA 打包成功！"
          else
            echo "幹！還是找不到二進位檔，把 target 目錄印出來看"
            find target -maxdepth 3
            exit 1
          fi

      - name: 上傳打包好的 IPA 檔案
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-IPA
          path: |
            **/build/Muguet.ipa
