      - name: 編譯與打包 IPA
        shell: bash
        run: |
          set -e

          echo "=== 正在尋找 project.yml ==="

          PROJECT_YML=$(find "$GITHUB_WORKSPACE" -name "project.yml" -type f | head -n 1)

          if [ -z "$PROJECT_YML" ]; then
            echo "找不到 project.yml"
            exit 1
          fi

          IOS_DIR=$(dirname "$PROJECT_YML")

          echo "iOS 專案目錄: $IOS_DIR"

          # 找 Cargo.toml
          CARGO_TOML=$(find "$GITHUB_WORKSPACE" -name "Cargo.toml" -type f | head -n 1)

          if [ -z "$CARGO_TOML" ]; then
            echo "找不到 Cargo.toml"
            exit 1
          fi

          CARGO_DIR=$(dirname "$CARGO_TOML")

          echo "Cargo 專案目錄: $CARGO_DIR"

          cd "$CARGO_DIR"

          echo "=== 安裝 iOS Rust target ==="

          rustup target add aarch64-apple-ios

          export IPHONEOS_DEPLOYMENT_TARGET=15.0

          echo "=== 開始透過 Cargo 編譯 iOS ==="

          cargo build \
            --target aarch64-apple-ios \
            --release

          echo "=== Cargo 編譯完成 ==="

          echo "=== 搜尋編譯結果 ==="

          TARGET_DIR="$CARGO_DIR/target/aarch64-apple-ios/release"

          echo "Target directory:"
          echo "$TARGET_DIR"

          if [ ! -d "$TARGET_DIR" ]; then
            echo "找不到 target directory！"
            echo "搜尋所有 target:"
            find "$CARGO_DIR" -type d -name "aarch64-apple-ios" -print || true
            exit 1
          fi

          echo "Target 內容:"
          find "$TARGET_DIR" -maxdepth 2 -type f -print

          # 找真正的 executable
          BINARY_PATH="$TARGET_DIR/muguet"

          if [ ! -f "$BINARY_PATH" ]; then
            echo "找不到 muguet binary"

            echo "目前 release 目錄:"
            ls -lah "$TARGET_DIR"

            echo "所有沒有副檔名的檔案:"
            find "$TARGET_DIR" \
              -maxdepth 1 \
              -type f \
              ! -name "*.*" \
              -print || true

            exit 1
          fi

          echo "找到編譯好的 binary:"
          echo "$BINARY_PATH"

          echo "=== 建立 .app ==="

          BUILD_DIR="$CARGO_DIR/build"
          APP_DIR="$BUILD_DIR/Payload/Muguet.app"

          rm -rf "$BUILD_DIR"

          mkdir -p "$APP_DIR"

          cp "$BINARY_PATH" "$APP_DIR/Muguet"

          chmod +x "$APP_DIR/Muguet"

          echo "=== 建立 Info.plist ==="

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIdentifier string com.badtrip.muguet" \
            -c "Add :CFBundleName string Muguet" \
            -c "Add :CFBundleDisplayName string Muguet" \
            -c "Add :CFBundlePackageType string APPL" \
            -c "Add :CFBundleShortVersionString string 1.0" \
            -c "Add :CFBundleVersion string 1" \
            -c "Add :MinimumOSVersion string 15.0" \
            -c "Add :UIDeviceFamily array" \
            -c "Add :UIDeviceFamily:0 integer 1" \
            -c "Add :UIDeviceFamily:1 integer 2" \
            "$APP_DIR/Info.plist"

          echo "=== 檢查 .app ==="

          find "$APP_DIR" -maxdepth 2 -type f -print

          echo "=== Info.plist ==="

          plutil -p "$APP_DIR/Info.plist"

          echo "=== 檢查 Mach-O binary ==="

          file "$APP_DIR/Muguet"

          echo "=== 建立 IPA ==="

          cd "$BUILD_DIR"

          rm -f Muguet.ipa

          zip -r Muguet.ipa Payload

          echo "=== IPA 打包成功 ==="

          ls -lh Muguet.ipa