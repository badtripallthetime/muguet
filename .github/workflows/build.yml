name: Build Muguet IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: 檢查程式碼
        uses: actions/checkout@v4

      - name: 安裝特定版本的 Rust
        run: |
          rustup toolchain install 1.98.1
          rustup default 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1

      - name: 安裝 XcodeGen
        run: |
          brew install xcodegen

      - name: 生成 Xcode 專案
        run: |
          echo "=== 正在尋找 project.yml ==="

          PROJECT_YML=$(find "$GITHUB_WORKSPACE" -name "project.yml" -type f | head -n 1)

          if [ -z "$PROJECT_YML" ]; then
            echo "幹！真的找不到 project.yml"
            exit 1
          fi

          echo "找到 project.yml:"
          echo "$PROJECT_YML"

          PROJECT_DIR=$(dirname "$PROJECT_YML")

          echo "專案目錄:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "=== 執行 XcodeGen ==="
          xcodegen generate

          echo "=== Xcode 專案生成完成 ==="

      - name: 編譯與打包 IPA
        shell: bash
        run: |
          set -e

          echo "=== 正在尋找 project.yml ==="

          PROJECT_YML=$(find "$GITHUB_WORKSPACE" -name "project.yml" -type f | head -n 1)

          if [ -z "$PROJECT_YML" ]; then
            echo "幹！找不到 project.yml"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_YML")

          echo "專案目錄: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "=== 安裝 iOS Rust target ==="
          rustup target add aarch64-apple-ios

          export IPHONEOS_DEPLOYMENT_TARGET=15.0

          echo "=== 開始透過 Cargo 編譯 iOS ==="

          cargo build \
            --target aarch64-apple-ios \
            --release

          echo "=== Cargo 編譯完成 ==="

          echo "=== 檢查編譯結果 ==="

          BINARY_PATH="$PROJECT_DIR/target/aarch64-apple-ios/release/muguet"

          if [ ! -f "$BINARY_PATH" ]; then
            echo "找不到預期的 muguet 執行檔"
            echo "目前 target 目錄內容:"
            find "$PROJECT_DIR/target/aarch64-apple-ios/release" \
              -maxdepth 2 \
              -type f \
              -print || true

            exit 1
          fi

          echo "找到編譯好的二進位檔:"
          echo "$BINARY_PATH"

          echo "=== 建立 .app ==="

          BUILD_DIR="$PROJECT_DIR/build"
          APP_DIR="$BUILD_DIR/Payload/Muguet.app"

          rm -rf "$BUILD_DIR"
          mkdir -p "$APP_DIR"

          cp "$BINARY_PATH" "$APP_DIR/Muguet"

          chmod +x "$APP_DIR/Muguet"

          echo "=== 建立 Info.plist ==="

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIdentifier string com.badtrip.muguet" \
            -c "Add :CFBundleName string Muguet" \
            -c "Add :CFBundleDisplayName string Muguet" \
            -c "Add :CFBundlePackageType string APPL" \
            -c "Add :CFBundleShortVersionString string 1.0" \
            -c "Add :CFBundleVersion string 1" \
            -c "Add :MinimumOSVersion string 15.0" \
            -c "Add :UIDeviceFamily array" \
            -c "Add :UIDeviceFamily:0 integer 1" \
            -c "Add :UIDeviceFamily:1 integer 2" \
            "$APP_DIR/Info.plist"

          echo "=== 檢查 .app ==="

          find "$APP_DIR" -maxdepth 2 -type f -print

          echo "=== Info.plist ==="
          plutil -p "$APP_DIR/Info.plist"

          echo "=== 建立 IPA ==="

          cd "$BUILD_DIR"

          rm -f Muguet.ipa

          zip -r Muguet.ipa Payload

          echo "=== IPA 打包成功 ==="

          ls -lh Muguet.ipa

      - name: 上傳打包好的 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-IPA
          path: |
            **/build/Muguet.ipa
          if-no-files-found: error